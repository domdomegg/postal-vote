name: ci

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only master pushes deploy, and only the deploys need these permissions —
    # id-token to mint the GitHub OIDC token used to assume the AWS role (the
    # role trust is pinned to this repo's master ref in aws-shared-infra), and
    # contents to push the web build to the gh-pages branch. Build+deploy share
    # this job, so the job carries the permissions.
    permissions:
      id-token: write
      contents: write
    concurrency:
      group: deploy-dev
      cancel-in-progress: false

    steps:
      - name: Checkout ${{ github.sha }}
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test

      # Deployment to dev environment (server)
      - name: "server: Retrieve env for dev environment"
        if: github.ref == 'refs/heads/master'
        run: echo "$DEV_ENV" > server/src/env/dev.ts
        env:
          DEV_ENV: ${{ secrets.DEV_ENV }}
      - name: Configure AWS credentials (OIDC)
        if: github.ref == 'refs/heads/master'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::338337944728:role/postal-vote-ci
          aws-region: eu-west-1
      - name: "server: Deploy to dev environment"
        if: github.ref == 'refs/heads/master'
        run: npm run deploy:dev
        working-directory: server

      # Deployment to prod environment (web, via GitHub Pages). There is no
      # longer a dev web deploy: postal-vote-dev is archived and the GH_PAT
      # secret it relied on no longer exists.
      - name: "web: Build for prod environment"
        if: github.ref == 'refs/heads/master'
        run: npm run build:prod
        working-directory: web
      - name: "web: Deploy to prod environment"
        if: github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/build
