# Structured to match the centrally managed templates:
# https://github.com/domdomegg/domdomegg/blob/master/file-sync/node-gh-pages.yaml
# Kept as a bespoke file because this repo deploys two things from one commit —
# the server to AWS Lambda and the web build to GitHub Pages — which neither
# template covers.

name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - name: Checkout ${{ github.sha }}
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Build
        run: npm run build --if-present
      - name: Test
        run: npm run test --if-present

  # Split from ci so that the deploy concurrency group below applies only to
  # master. While both lived in one job, every PR joined the deploy group and
  # batches of Dependabot PRs evicted each other from the queue — a queued run
  # displaces another queued run regardless of cancel-in-progress.
  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # id-token mints the GitHub OIDC token used to assume the AWS role (trust is
    # pinned to this repo's master ref in aws-shared-infra); contents pushes the
    # web build to the gh-pages branch.
    permissions:
      id-token: write
      contents: write
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    env:
      CI: true
    steps:
      - name: Checkout ${{ github.sha }}
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci

      # Deployment to dev environment (server)
      - name: "server: Retrieve env for dev environment"
        run: echo "$DEV_ENV" > server/src/env/dev.ts
        env:
          DEV_ENV: ${{ secrets.DEV_ENV }}
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::338337944728:role/postal-vote-ci
          aws-region: eu-west-1
      - name: "server: Deploy to dev environment"
        run: npm run deploy:dev
        working-directory: server

      # Deployment to prod environment (web, via GitHub Pages). There is no
      # longer a dev web deploy: postal-vote-dev is archived and the GH_PAT
      # secret it relied on no longer exists.
      - name: "web: Build for prod environment"
        run: npm run build:prod
        working-directory: web
      - name: "web: Deploy to prod environment"
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/build
