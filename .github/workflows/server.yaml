name: server

on:
  push:
    paths:
      - ".github/workflows/server.yaml"
      - "server/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only master pushes deploy, and only the deploy needs to mint OIDC tokens —
    # but build+deploy share this job, so the job carries the permission. The
    # role trust is pinned to this repo's master ref in aws-shared-infra.
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-dev
      cancel-in-progress: false

    steps:
      - name: Checkout ${{ github.sha }}
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: "Install dependencies"
        run: npm ci
      - name: "Lint"
        run: npm run lint
        working-directory: server
      - name: "Build"
        run: npm run build
        working-directory: server
      - name: "Test"
        run: npm run test
        working-directory: server

      - name: "Retrieve env for dev environment"
        if: github.ref == 'refs/heads/master'
        run: echo "$DEV_ENV" > server/src/env/dev.ts
        env:
          DEV_ENV: ${{ secrets.DEV_ENV }}
      - name: Configure AWS credentials (OIDC)
        if: github.ref == 'refs/heads/master'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::338337944728:role/postal-vote-ci
          aws-region: eu-west-1
      - name: "Deploy to dev environment"
        if: github.ref == 'refs/heads/master'
        run: npm run deploy:dev
        working-directory: server
